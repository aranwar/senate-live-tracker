<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Senate Live Tracker</title><style>body{font-family:system-ui;background:#0b1020;color:#eef2ff;margin:0}.wrap{max-width:1200px;margin:auto;padding:28px}h1{margin:0 0 4px}.sub{color:#9ca3af}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{background:#182033;color:#fff;border:1px solid #303a52;padding:10px 16px;border-radius:9px;cursor:pointer}.tabs .on{background:#fff;color:#111827}table{width:100%;border-collapse:collapse;background:#111827;border-radius:12px;overflow:hidden}th,td{padding:12px;border-bottom:1px solid #273244;text-align:left}th{color:#9ca3af}.R{color:#fb7185}.D{color:#60a5fa}.I{color:#fbbf24}.muted{color:#9ca3af}.err{color:#fca5a5}.pill{padding:2px 7px;border:1px solid currentColor;border-radius:99px;font-size:12px}a{color:#93c5fd}@media(max-width:700px){th,td{padding:8px;font-size:13px}.wrap{padding:14px}}</style></head><body><div class="wrap"><h1>2026 Senate Live Tracker</h1><div class="sub">Selected races · refreshes every 60 seconds · market prices are market prices, not an election forecast</div><div class="tabs"><button id="bp" class="on">Latest Polls</button><button id="bm">Polymarket</button></div><div id="status" class="sub">Loading…</div><div id="app"></div></div><script>
let data=null,tab='polls'; const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){if(!data)return; document.querySelector('#status').textContent='Last updated: '+new Date(data.updated).toLocaleString(); let h=''; if(tab==='polls'){h='<table><tr><th>State</th><th>Pollster</th><th>Candidates</th><th>Spread</th></tr>'; for(const r of data.polls){h+=`<tr><td><b>${esc(r.state)}</b></td>`+(r.error?`<td colspan=3 class=err>${esc(r.error)}</td>`:`<td>${esc(r.pollster)}</td><td>${r.candidates.map(c=>`<span class="${c.party}"><span class=pill>${c.party}</span> ${esc(c.name)} <b>${c.pct}%</b></span>`).join(' &nbsp; vs &nbsp; ')}</td><td>${esc(r.spread)}</td>`)+`</tr>`} h+='</table>'}else{h='<table><tr><th>State</th><th>Candidate</th><th>Party</th><th>Market price</th></tr>'; for(const r of data.markets){if(!r.candidates.length)h+=`<tr><td><b>${esc(r.state)}</b></td><td colspan=3 class=muted>No matching active candidate market found</td></tr>`;else r.candidates.forEach((c,i)=>h+=`<tr><td>${i?'':`<b>${esc(r.state)}</b>`}</td><td>${esc(c.name)}</td><td class=${c.party}>${c.party}</td><td>${c.price==null?'—':(c.price*100).toFixed(1)+'¢'}</td></tr>`)} h+='</table>'} document.querySelector('#app').innerHTML=h}
async function load(){try{const r=await fetch('/api/data');data=await r.json();render()}catch(e){document.querySelector('#status').textContent='Could not load live data: '+e}}
document.querySelector('#bp').onclick=()=>{tab='polls';bp.className='on';bm.className='';render()};document.querySelector('#bm').onclick=()=>{tab='markets';bm.className='on';bp.className='';render()};load();setInterval(load,60000);
</script></body></html>
